<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPulse - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Join FitPulse and start your fitness journey</p>
        <form id="signup-form">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required placeholder="••••••••">
            </div>
            <span id="signup-error" class="error-msg"></span>
            <button type="submit">Sign Up</button>
        </form>
        <div class="switch-text">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>
    <script src="app.js"></script>
    <script>initSignup();</script>
</body>
</html>
