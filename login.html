<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPulse - Log In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to track your progress</p>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <span id="login-error" class="error-msg"></span>
            <button type="submit">Log In</button>
        </form>
        <div class="switch-text">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    <script src="app.js"></script>
    <script>initLogin();</script>
</body>
</html>
